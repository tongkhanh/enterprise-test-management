<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETMS · Bug Tracking</title><link rel="stylesheet" href="/styles.css"></head><body><div class="shell"><main>
<section class="hero"><div><div class="eyebrow">Phân hệ 6</div><h1>Bug Tracking</h1><p class="muted">Báo lỗi, phân công, lịch sử trạng thái, vòng retest và KPI.</p></div><button data-load="/bugs">Tải danh sách bug</button></section>
<div class="grid">
<section class="card wide"><h2>Báo bug mới</h2><form data-api="/bugs"><div class="row"><label>Project ID<input name="project" required></label><label>Assignee ID<input name="assignedTo"></label></div><label>Tiêu đề<input name="title" required></label><label>Mô tả<textarea name="description" required></textarea></label><label>Các bước tái hiện<textarea name="stepsToReproduce"></textarea></label><div class="row"><label>Severity<select name="severity"><option>Critical</option><option>Major</option><option>Minor</option><option>Trivial</option></select></label><label>Priority<select name="priority"><option>Urgent</option><option>High</option><option>Medium</option><option>Low</option></select></label></div><div class="row"><label>Môi trường<input name="environment" placeholder="Staging"></label><label>Browser<input name="browser" placeholder="Chrome"></label></div><label>Attachments (JSON)<textarea name="attachments" data-json>[]</textarea></label><button>Tạo bug + tính KPI + tìm trùng nếu có AI key</button></form><pre class="result hidden"></pre></section>
<section class="card"><h2>Cập nhật trạng thái</h2><form data-api="/bugs/{id}" data-method="PATCH"><label>Bug ID<input name="id" data-param required></label><label>Trạng thái<select name="status"><option>Open</option><option>InProgress</option><option>Resolved</option><option>Verified</option><option>Closed</option><option>Reopened</option></select></label><label>Ghi chú chuyển trạng thái<textarea name="statusComment"></textarea></label><label>Assignee ID<input name="assignedTo"></label><button>Cập nhật & ghi lịch sử</button></form><pre class="result hidden"></pre></section>
<section class="card"><h2>Retest bug</h2><form data-api="/bugs/{id}/retests"><label>Bug ID<input name="id" data-param required></label><label>Kết quả<select name="result"><option>Passed</option><option>Failed</option></select></label><label>Ghi chú<textarea name="notes"></textarea></label><label>Evidence (JSON)<textarea name="evidence" data-json>[]</textarea></label><button>Ghi vòng retest tiếp theo</button></form><pre class="result hidden"></pre></section>
<section class="card"><h2>Chi tiết & lịch sử</h2><form data-api="/bugs/{id}" data-method="GET"><label>Bug ID<input name="id" data-param required></label><button>Tải bug, history và retest</button></form><pre class="result hidden"></pre></section>
<section class="card"><h2>Lọc bug</h2><form data-api="/bugs" data-method="GET"><label>Project ID<input name="project"></label><div class="row"><label>Severity<select name="severity"><option value="">Tất cả</option><option>Critical</option><option>Major</option><option>Minor</option></select></label><label>Status<select name="status"><option value="">Tất cả</option><option>New</option><option>Open</option><option>Resolved</option><option>Closed</option></select></label></div><label>Từ khóa<input name="search"></label><button>Tìm bug</button></form><pre class="result hidden"></pre></section>
<section class="card wide"><h2>Phản hồi API</h2><pre id="globalResult" class="result">Sẵn sàng kiểm thử.</pre></section>
</div></main></div><script src="/app.js"></script></body></html>
