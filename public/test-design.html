<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETMS · Test Design</title><link rel="stylesheet" href="/styles.css"></head><body><div class="shell"><main>
<section class="hero"><div><div class="eyebrow">Phân hệ 4</div><h1>Thiết kế kiểm thử</h1><p class="muted">Cây suite, test steps, dữ liệu dùng chung và maker-checker.</p></div><div class="actions"><button data-load="/test-suites">Cây suite</button><button data-load="/test-cases">Test cases</button><button data-load="/review-requests">Yêu cầu duyệt</button></div></section>
<div class="grid">
<section class="card"><h2>Tạo Test Suite</h2><form data-api="/test-suites"><label>Project ID<input name="project" required></label><label>Tên suite<input name="name" required></label><label>Suite cha<input name="parentSuite"></label><label>Thứ tự<input name="order" type="number" data-number value="0"></label><button>Tạo thư mục</button></form><pre class="result hidden"></pre></section>
<section class="card"><h2>Tạo Test Case</h2><form data-api="/test-cases"><label>Test Suite ID<input name="testSuite" required></label><label>User Story ID<input name="userStory"></label><label>Tiêu đề<input name="title" required></label><label>Điều kiện tiên quyết<textarea name="preconditions"></textarea></label><label>Test steps (JSON)<textarea class="code" name="testSteps" data-json>[
  {"stepNumber":1,"action":"Mở trang đăng nhập","expectedResult":"Form hiển thị"},
  {"stepNumber":2,"action":"Nhập thông tin hợp lệ","expectedResult":"Vào Dashboard"}
]</textarea></label><button>Tạo Test Case</button></form><pre class="result hidden"></pre></section>
<section class="card"><h2>Dữ liệu test dùng chung</h2><form data-api="/shared-test-data"><label>Project ID<input name="project" required></label><label>Tên bộ dữ liệu<input name="name" required></label><label>Danh mục<select name="category"><option>Account</option><option>CreditCard</option><option>Address</option><option>APIKey</option><option>Custom</option></select></label><label>Data JSON<textarea class="code" name="data" data-json>{"email":"qa@example.com","password":"secret"}</textarea></label><button>Lưu dữ liệu</button></form><pre class="result hidden"></pre></section>
<section class="card"><h2>Gửi duyệt</h2><form data-api="/test-cases/{id}/review"><label>Test Case ID<input name="id" data-param required></label><label>QA Lead / Reviewer ID<input name="reviewer" required></label><label>Ghi chú<textarea name="reviewNote"></textarea></label><button>Gửi yêu cầu duyệt</button></form><pre class="result hidden"></pre></section>
<section class="card"><h2>QA Lead phê duyệt</h2><form data-api="/review-requests/{id}/decision" data-method="PATCH"><label>Review Request ID<input name="id" data-param required></label><label>Quyết định<select name="decision"><option>Approved</option><option>Rejected</option></select></label><label>Nhận xét<textarea name="reviewNote"></textarea></label><button>Ghi quyết định</button></form><pre class="result hidden"></pre></section>
<section class="card"><h2>Lọc Test Case</h2><form data-api="/test-cases" data-method="GET"><label>Suite ID<input name="testSuite"></label><div class="row"><label>Status<select name="status"><option value="">Tất cả</option><option>Draft</option><option>NeedsReview</option><option>Active</option></select></label><label>Priority<select name="priority"><option value="">Tất cả</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></label></div><button>Tìm kiếm</button></form><pre class="result hidden"></pre></section>
<section class="card wide"><h2>Phản hồi API</h2><pre id="globalResult" class="result">Sẵn sàng kiểm thử.</pre></section>
</div></main></div><script src="/app.js"></script></body></html>
